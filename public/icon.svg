    <rect x="150" y="150" width="212" height="212" rx="10"/>
    <rect x="150" y="150" width="212" height="212" rx="10" transform="rotate(45 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="44" fill="none" stroke="#43D9A3" stroke-width="15"/>
  <circle cx="256" cy="256" r="10" fill="#43D9A3"/>
