<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="14%" r="112%">
      <stop offset="0%" stop-color="#123328"/>
      <stop offset="52%" stop-color="#0A2019"/>
      <stop offset="100%" stop-color="#05100D"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3D49E"/>
      <stop offset="58%" stop-color="#E9C68A"/>
      <stop offset="100%" stop-color="#B08C4E"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Руб-эль-хизб: два квадрата, повёрнутые друг относительно друга -->
